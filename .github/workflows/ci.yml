name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Installer syntax check
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install.sh
          sh -n .github/scripts/check-release-baseline.sh
          sh -n .github/scripts/gen-changelog.sh
          sh -n scripts/release_baseline_test.sh
          sh scripts/release_baseline_test.sh

      - name: Vet
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Test
        env:
          GOWORK: "off"
        run: go test -buildvcs=false -count=1 ./...

      - name: Race test critical state paths
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go test -race -buildvcs=false -count=1 ./internal/host ./internal/store ./internal/tools

      - name: Cross-build Linux release targets
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          GOOS=linux GOARCH=amd64 go build -buildvcs=false -o "$RUNNER_TEMP/ainovel-cli-linux-amd64" ./cmd/ainovel-cli
          GOOS=linux GOARCH=arm64 go build -buildvcs=false -o "$RUNNER_TEMP/ainovel-cli-linux-arm64" ./cmd/ainovel-cli

      - name: Smoke test Linux binary without config or display
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/ainovel-empty-home"
          HOME="$RUNNER_TEMP/ainovel-empty-home" DISPLAY= "$RUNNER_TEMP/ainovel-cli-linux-amd64" --help
          HOME="$RUNNER_TEMP/ainovel-empty-home" DISPLAY= "$RUNNER_TEMP/ainovel-cli-linux-amd64" deconstruct --help

      - name: Smoke test Docker entrypoint without network or config
        if: runner.os == 'Linux'
        run: |
          docker build --tag ainovel-cli:ci .
          docker run --rm --network none ainovel-cli:ci --help
          docker run --rm --network none ainovel-cli:ci deconstruct --help
